# Версия и текст релиза по Conventional Commits (docs/releases.md).
# Запуск: `uvx git-cliff`, отдельная установка не нужна.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**несовместимо:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Порядок групп задают комментарии; служебные типы в релиз не попадают.
# Релиз собирается по заголовкам PR: мерж-коммит получает заголовок PR (настройка
# репозитория merge_commit_title=PR_TITLE), а коммиты внутри ветки пропускаются, иначе
# один PR попадал бы и в текст релиза, и в расчёт версии дважды.
# Мержи до 2026-11-01 выглядели как «Merge pull request #N from <ветка>», а их заголовок PR
# лежал в теле — препроцессор переносит его в первую строку, чтобы и эта история считалась по PR.
commit_preprocessors = [
    { pattern = '(?s)^Merge pull request #(?<num>[0-9]+) from [^\n]*\n\n(?<title>.*)$', replace = "${title} (#${num})" },
]
commit_parsers = [
    { field = "merge_commit", pattern = "false", skip = true },
    { message = "^feat", group = "<!-- 0 -->Новое" },
    { message = "^fix", group = "<!-- 1 -->Исправления" },
    { message = "^perf", group = "<!-- 2 -->Производительность" },
    { message = "^refactor", group = "<!-- 3 -->Рефакторинг" },
    { message = "^(chore|ci|docs|test|build|style|revert)", skip = true },
]

[bump]
# До 1.0 несовместимые изменения поднимают minor, а не major
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
