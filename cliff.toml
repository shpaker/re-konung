# Версия и текст релиза по Conventional Commits (docs/releases.md).
# Запуск: `uvx git-cliff`, отдельная установка не нужна.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**несовместимо:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Positive selection: a commit counts only when a parser below matches it, so the
# ordinary commits inside a PR branch never reach a release on their own.
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Each PR lands on main as exactly one commit whose subject GitHub ends with the PR
# number, "(#N)" (squash_merge_commit_title=PR_TITLE). Requiring that suffix in every
# type parser admits a PR once and no more; a stray branch commit without "(#N)" falls
# through to the catch-all skip. Merges before 2026-11-01 read "Merge pull request #N
# from <branch>" with the PR title in the body, so the preprocessor first lifts that
# title onto the first line and these same parsers still count the old history.
commit_preprocessors = [
    { pattern = '(?s)^Merge pull request #(?<num>[0-9]+) from [^\n]*\n\n(?<title>.*)$', replace = "${title} (#${num})" },
]
commit_parsers = [
    { message = "^feat(\\(.*\\))?!?: .+ \\(#[0-9]+\\)$", group = "<!-- 0 -->Новое" },
    { message = "^fix(\\(.*\\))?!?: .+ \\(#[0-9]+\\)$", group = "<!-- 1 -->Исправления" },
    { message = "^perf(\\(.*\\))?!?: .+ \\(#[0-9]+\\)$", group = "<!-- 2 -->Производительность" },
    { message = "^refactor(\\(.*\\))?!?: .+ \\(#[0-9]+\\)$", group = "<!-- 3 -->Рефакторинг" },
    { message = "^(chore|ci|docs|test|build|style|revert)", skip = true },
    { message = ".*", skip = true },
]

[bump]
# До 1.0 несовместимые изменения поднимают minor, а не major
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
