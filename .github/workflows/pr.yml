# Форма PR по CONTRIBUTING.md; логика — .github/scripts/contrib_form.py, покрыта tests/test_contrib_form.py.
name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            style
            revert

      # Тело — из события в переменную окружения: многострочным аргументом его не передать.
      - name: Форма описания PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/contrib_form.py
