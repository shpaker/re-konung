# Те же проверки, что перед push (Python и Rust). Тесты на данных игры в CI
# пропускаются: оригиналов в репозитории нет
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Версия пакета берётся из git-тегов (hatch-vcs)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  # stable Rust на GitHub-раннерах уже есть, ставить не нужно
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Bevy с default-фичами линкуется с wayland, x11, ALSA и udev: без -dev
      # пакетов сборка падает на wayland-sys/alsa-sys/libudev-sys, не дойдя до
      # нашего кода. Список — docs/linux_dependencies.md в крейте bevy.
      - name: Системные библиотеки для Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libx11-dev libxkbcommon-x11-0 libxkbcommon-dev \
            libwayland-dev libasound2-dev libudev-dev
      - run: cargo fmt --manifest-path crates/Cargo.toml --all --check
      - run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/Cargo.toml

  # Smoke-build of dev-runtime profile on Windows: validates the new profile,
  # reduced bevy features and .cargo/config.toml (rust-lld). Static linking
  # only — dynamic_linking builds bevy_dylib.dll (full recompile of every Bevy
  # crate as cdylib, ~10× slower) and launches a window requiring GPU context
  # that headless CI cannot provide.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke-build dev-runtime (static)
        run: cargo build --profile dev-runtime --manifest-path crates/Cargo.toml -p kn-viewer -p kn-player
