# LLD via the bundled rust-lld (rustc >= 1.70, no external tools): link-heavy
# dev-runtime relinks and test binaries on Windows. Only affects local Windows
# builds; CI is ubuntu-latest. Remove this file to fall back to link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link"]
