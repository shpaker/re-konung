[package]
name = "kn-game"
version = "0.1.0"
edition = "2024"
publish = false
description = "Общий фасад игр серии «Князь»: модель сцены и подготовка данных для отображения"

[dependencies]
kn-isometric = { path = "../../shared/isometric" }
kn-movement = { path = "../../shared/movement" }
k1-data = { path = "../k1/k1-data" }
k1-game = { path = "../k1/k1-game" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
