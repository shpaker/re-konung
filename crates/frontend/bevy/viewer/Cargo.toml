[package]
name = "kn-fe-viewer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bevy frontend of the «Князь» map viewer: window, Feathers panel, overlays, diagnostics, scene rebuild"

[dependencies]
kn-isometric = { path = "../../../shared/isometric" }
kn-lighting = { path = "../lighting" }
kn-game = { path = "../../../game/kn-game" }
kn-render = { path = "../render" }
kn-input = { path = "../input" }
kn-ui = { path = "../ui" }
bevy = { workspace = true, features = ["bevy_feathers"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[features]
dynamic = ["bevy/dynamic_linking"]

[dev-dependencies]
k1-data = { path = "../../../game/k1/k1-data" }
k1-game = { path = "../../../game/k1/k1-game" }
tempfile = "3"
