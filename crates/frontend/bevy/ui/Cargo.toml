[package]
name = "kn-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared Bevy UI mechanics for the «Князь» frontends: Feathers theme, checkbox mirroring, pointer capture. No rendering, no input bindings, no game rules"

[dependencies]
bevy = { workspace = true, features = ["bevy_feathers"] }
