[package]
name = "kn-exec"
version = "0.1.0"
edition = "2024"
publish = false
description = "Исполняемый файл игры «Князь»: запуск новой игры"

[[bin]]
name = "re-konung"
path = "src/main.rs"

[dependencies]
kn-game = { path = "../game/kn-game" }
kn-input = { path = "../frontend/bevy/input" }
kn-render = { path = "../frontend/bevy/render" }
kn-ui = { path = "../frontend/bevy/ui" }
bevy = "0.20"
clap = { version = "4", features = ["derive"] }
