[package]
name = "kn-viewer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Просмотрщик карт «Князя»: окно, интерфейс, headless-диагностика"

[lib]
name = "kn_viewer"
path = "src/lib.rs"

[[bin]]
name = "re-konung-viewer"
path = "src/main.rs"

[dependencies]
kn-game = { path = "../kn-game" }
kn-io = { path = "../kn-io" }
bevy = { version = "0.20", features = ["bevy_feathers"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
