[project]
name = "konung"
version = "0.1.0"
description = "Разбор ресурсов игр серии «Князь» (1С/Snowball)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
