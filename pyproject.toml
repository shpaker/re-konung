[project]
name = "konung"
# Версия — из git-тега vX.Y.Z (hatch-vcs); между тегами — X.Y.Z.devN+g<sha>
dynamic = ["version"]
description = "Разбор ресурсов игр серии «Князь» (1С/Snowball)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["konung"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
